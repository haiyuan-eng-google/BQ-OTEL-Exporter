exporters:
  bigquery:
    project: my-project
    dataset: otel

  bigquery/full:
    project: my-project
    dataset: otel
    location: US
    kms_key_name: projects/my-project/locations/us/keyRings/otel/cryptoKeys/default
    labels:
      env: prod
    traces:
      table: spans
      partition_expiration_days: 365
      require_partition_filter: true
      kms_key_name: projects/my-project/locations/us/keyRings/otel/cryptoKeys/spans
      labels:
        signal: traces
      max_staleness: 15m
    logs:
      table: logs
      partition_expiration_days: 90
      require_partition_filter: true
      kms_key_name: projects/my-project/locations/us/keyRings/otel/cryptoKeys/logs
      labels:
        signal: logs
      max_staleness: 15m
      # Optional. Records without these attributes fall back to well-known
      # attributes, then to the service name and the record fingerprint.
      log_name_attribute: log.file.name
      insert_id_attribute: log.record.uid
    metrics:
      table: metrics
      partition_expiration_days: 180
      require_partition_filter: true
      kms_key_name: projects/my-project/locations/us/keyRings/otel/cryptoKeys/metrics
      labels:
        signal: metrics
      max_staleness: 15m
    quarantine:
      enabled: true
      table: otel_quarantine
      partition_expiration_days: 30
      require_partition_filter: false
      kms_key_name: projects/my-project/locations/us/keyRings/otel/cryptoKeys/quarantine
      labels:
        signal: quarantine
      max_staleness: 30m
    credentials:
      impersonate_service_account: writer@my-project.iam.gserviceaccount.com
      impersonate_delegates:
        - hop@my-project.iam.gserviceaccount.com
      quota_project: my-billing-project
      universe_domain: googleapis.com
    endpoint:
      admin_url: https://bigquery.googleapis.com
    auto_create:
      dataset: true
      tables: true
      companion_views: true
      search_indexes: true
    write:
      max_request_bytes: 8388608
      max_row_bytes: 1048576
      max_inflight_requests: 8
      max_inflight_bytes: 67108864
    limits:
      max_attribute_count: 1024
      max_event_count: 1024
      max_link_count: 1024
      max_nesting_depth: 16
      max_collection_size: 4096
      max_value_bytes: 262144
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_elapsed_time: 900s
    timeout: 30s

  # Emulator only. Insecure transport and disabled auth are refused unless the
  # endpoint is a loopback address.
  bigquery/emulator:
    project: my-project
    dataset: otel
    endpoint:
      url: localhost:9050
      insecure: true
      without_authentication: true
