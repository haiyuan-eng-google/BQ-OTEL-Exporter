exporters:
  bigquery:
    project: my-project
    dataset: otel

  bigquery/full:
    project: my-project
    dataset: otel
    spans_table: spans
    logs_table: logs
    auto_create:
      dataset: true
      tables: true
      location: US
    write:
      max_request_bytes: 9437184
      max_row_bytes: 1048576
      max_inflight_requests: 1000
      max_inflight_bytes: 104857600
    promote_attributes:
      - attribute: gen_ai.system
        type: STRING
      - attribute: gen_ai.usage.input_tokens
        column: input_tokens
        type: INT64
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_elapsed_time: 900s
    timeout: 30s
