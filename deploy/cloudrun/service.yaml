# Cloud Run Knative service manifest for the BigQuery OTel Collector.
#
# Compatible with `gcloud run services replace deploy/cloudrun/service.yaml`.
# Cloud Run allows a single ingress containerPort per service (`http1` on 4318
# for OTLP/HTTP by default; change to `name: h2c` and `containerPort: 4317` to
# expose OTLP/gRPC instead). The container image bundles a default collector
# configuration at `/etc/otel/config.yml` driven by BQ_PROJECT, BQ_DATASET, and
# BQ_LOCATION environment variables.
#
# Prerequisites:
# - The container image must be pushed to GHCR or Artifact Registry.
# - A service account with the custom IAM role from deploy/terraform/main.tf
#   must exist.
# - The BigQuery dataset and tables must be provisioned (use deploy/terraform/).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bq-otel-collector
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      serviceAccountName: otel-collector@my-project.iam.gserviceaccount.com
      containers:
        - name: otelcollector
          image: ghcr.io/haiyuan-eng-google/bq-otel-collector:0.1.0
          args:
            - "--config=/etc/otel/config.yml"
          ports:
            - name: http1
              containerPort: 4318
          env:
            - name: BQ_PROJECT
              value: my-project
            - name: BQ_DATASET
              value: otel
            - name: BQ_LOCATION
              value: US
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
  traffic:
    - percent: 100
      latestRevision: true
