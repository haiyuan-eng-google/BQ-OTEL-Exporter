# Cloud Run v2 service manifest for the BigQuery OTel Collector.
#
# Deploys the multi-arch container image as a Cloud Run service that
# receives OTLP/gRPC on port 4317 and OTLP/HTTP on port 4318. Authentication
# uses a least-privilege service account with only the BigQuery permissions
# the exporter needs.
#
# Prerequisites:
# - The container image must be pushed to GHCR or Artifact Registry.
# - A service account with the custom IAM role from deploy/terraform/main.tf
#   must exist.
# - The BigQuery dataset and tables must be provisioned (use deploy/terraform/).

apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: bq-otel-collector
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      serviceAccount: otel-collector@my-project.iam.gserviceaccount.com
      containers:
        - name: otelcollector
          image: ghcr.io/haiyuan-eng-google/bq-otel-collector:0.1.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: BQ_PROJECT
              value: my-project
            - name: BQ_DATASET
              value: otel
            - name: BQ_LOCATION
              value: US
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
      maxScale: 10
      minScale: 1
  traffic:
    - percent: 100
      type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
