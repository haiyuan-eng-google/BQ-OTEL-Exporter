# Default values for the BigQuery OTel Collector Helm chart.
# Override these with --set or values.yaml overrides.

image:
  repository: ghcr.io/haiyuan-eng-google/bq-otel-collector
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# BigQuery destination.
bigquery:
  project: ""
  dataset: "otel"
  location: "US"
  tracesTable: "otel_spans"
  logsTable: "otel_logs"
  metricsTable: "otel_metrics"
  autoCreateDataset: false
  autoCreateTables: false
  autoCreateCompanionViews: false
  autoCreateAllowUnprunableViews: false
  autoCreateSearchIndexes: false
  # Enterprise governance: CMEK key and labels for the dataset and tables.
  # These and the table options below, quarantine's included, take effect only
  # on resources the collector creates itself (the autoCreate* options above).
  # For Terraform-provisioned tables, set the deploy/terraform/ variables
  # instead; see "Enterprise Governance" in deploy/README.md.
  kmsKeyName: ""
  labels: {}
  # Per-signal partition lifecycle and governance (collector-created tables).
  traces:
    partitionExpirationDays: 0
    requirePartitionFilter: false
    kmsKeyName: ""
    labels: {}
    maxStaleness: ""
  logs:
    partitionExpirationDays: 0
    requirePartitionFilter: false
    kmsKeyName: ""
    labels: {}
    maxStaleness: ""
  metrics:
    partitionExpirationDays: 0
    requirePartitionFilter: false
    kmsKeyName: ""
    labels: {}
    maxStaleness: ""

# Optional GCS offload for large payloads.
offload:
  enabled: false
  bucket: ""
  prefix: ""
  authorizer: ""
  minBytes: 0
  maxObjectBytes: 0
  maxConcurrency: 0
  timeout: ""
  cacheSize: 4096

# Optional quarantine dead-letter table.
quarantine:
  enabled: false
  table: "otel_quarantine"
  metadataOnly: false
  maxRawPayloadBytes: 0
  timeout: ""
  partitionExpirationDays: 30
  requirePartitionFilter: false
  kmsKeyName: ""
  labels: {}
  maxStaleness: ""

# Optional client-side PII / secret redaction.
redaction:
  enabled: false
  blockedKeys: []
  disableDefaultKeys: false
  blockedValuePatterns: []
  maskReplacement: ""
  redactLogBody: false

# Storage Write API stream pool tuning.
write:
  streamPoolSize: 1

# Collector OTLP receivers.
receivers:
  grpc:
    port: 4317
  http:
    port: 4318

# Health check extension.
healthCheck:
  enabled: true
  port: 13133

# Persistent queue for crash-replay durability.
persistentQueue:
  enabled: false
  storageClass: ""
  size: 1Gi
  mountPath: /var/lib/otel/queue

# Resource limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Number of replicas.
replicaCount: 1

# Service account for Workload Identity Federation.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # For Workload Identity Federation, set:
  # annotations:
  #   iam.gke.io/gcp-service-account: "otel-collector@my-project.iam.gserviceaccount.com"

# Node selector, tolerations, affinity.
nodeSelector: {}
tolerations: []
affinity: {}

# Security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod-level security.
podSecurityContext:
  fsGroup: 65532
