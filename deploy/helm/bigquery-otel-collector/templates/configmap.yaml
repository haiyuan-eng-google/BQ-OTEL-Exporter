apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bigquery-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.receivers.grpc.port }}
          http:
            endpoint: 0.0.0.0:{{ .Values.receivers.http.port }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 1000

    exporters:
      bigquery:
        project: ${env:BQ_PROJECT}
        dataset: ${env:BQ_DATASET}
        location: ${env:BQ_LOCATION}
        auto_create:
          dataset: {{ .Values.bigquery.autoCreateDataset }}
          tables: {{ .Values.bigquery.autoCreateTables }}
          {{- if .Values.bigquery.autoCreateCompanionViews }}
          companion_views: {{ .Values.bigquery.autoCreateCompanionViews }}
          {{- end }}
          {{- if .Values.bigquery.autoCreateSearchIndexes }}
          search_indexes: {{ .Values.bigquery.autoCreateSearchIndexes }}
          {{- end }}
        traces:
          table: {{ .Values.bigquery.tracesTable | quote }}
          {{- if .Values.bigquery.traces.partitionExpirationDays }}
          partition_expiration_days: {{ .Values.bigquery.traces.partitionExpirationDays }}
          {{- end }}
          {{- if .Values.bigquery.traces.requirePartitionFilter }}
          require_partition_filter: {{ .Values.bigquery.traces.requirePartitionFilter }}
          {{- end }}
          {{- if .Values.bigquery.traces.kmsKeyName }}
          kms_key_name: {{ .Values.bigquery.traces.kmsKeyName | quote }}
          {{- end }}
          {{- with .Values.bigquery.traces.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.bigquery.traces.maxStaleness }}
          max_staleness: {{ .Values.bigquery.traces.maxStaleness | quote }}
          {{- end }}
        logs:
          table: {{ .Values.bigquery.logsTable | quote }}
          {{- if .Values.bigquery.logs.partitionExpirationDays }}
          partition_expiration_days: {{ .Values.bigquery.logs.partitionExpirationDays }}
          {{- end }}
          {{- if .Values.bigquery.logs.requirePartitionFilter }}
          require_partition_filter: {{ .Values.bigquery.logs.requirePartitionFilter }}
          {{- end }}
          {{- if .Values.bigquery.logs.kmsKeyName }}
          kms_key_name: {{ .Values.bigquery.logs.kmsKeyName | quote }}
          {{- end }}
          {{- with .Values.bigquery.logs.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.bigquery.logs.maxStaleness }}
          max_staleness: {{ .Values.bigquery.logs.maxStaleness | quote }}
          {{- end }}
        metrics:
          table: {{ .Values.bigquery.metricsTable | quote }}
          {{- if .Values.bigquery.metrics.partitionExpirationDays }}
          partition_expiration_days: {{ .Values.bigquery.metrics.partitionExpirationDays }}
          {{- end }}
          {{- if .Values.bigquery.metrics.requirePartitionFilter }}
          require_partition_filter: {{ .Values.bigquery.metrics.requirePartitionFilter }}
          {{- end }}
          {{- if .Values.bigquery.metrics.kmsKeyName }}
          kms_key_name: {{ .Values.bigquery.metrics.kmsKeyName | quote }}
          {{- end }}
          {{- with .Values.bigquery.metrics.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.bigquery.metrics.maxStaleness }}
          max_staleness: {{ .Values.bigquery.metrics.maxStaleness | quote }}
          {{- end }}
        {{- if .Values.bigquery.kmsKeyName }}
        kms_key_name: {{ .Values.bigquery.kmsKeyName | quote }}
        {{- end }}
        {{- with .Values.bigquery.labels }}
        labels:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.offload.enabled }}
        offload:
          enabled: true
          bucket: {{ .Values.offload.bucket | quote }}
          {{- if .Values.offload.prefix }}
          prefix: {{ .Values.offload.prefix | quote }}
          {{- end }}
          {{- if .Values.offload.authorizer }}
          authorizer: {{ .Values.offload.authorizer | quote }}
          {{- end }}
          {{- if .Values.offload.minBytes }}
          min_bytes: {{ .Values.offload.minBytes }}
          {{- end }}
          {{- if .Values.offload.maxObjectBytes }}
          max_object_bytes: {{ .Values.offload.maxObjectBytes }}
          {{- end }}
          {{- if .Values.offload.maxConcurrency }}
          max_concurrency: {{ .Values.offload.maxConcurrency }}
          {{- end }}
          {{- if .Values.offload.timeout }}
          timeout: {{ .Values.offload.timeout | quote }}
          {{- end }}
          {{- if .Values.offload.cacheSize }}
          cache_size: {{ .Values.offload.cacheSize }}
          {{- end }}
        {{- end }}
        {{- if .Values.quarantine.enabled }}
        quarantine:
          enabled: true
          table: {{ .Values.quarantine.table | quote }}
          {{- if .Values.quarantine.metadataOnly }}
          metadata_only: {{ .Values.quarantine.metadataOnly }}
          {{- end }}
          {{- if .Values.quarantine.maxRawPayloadBytes }}
          max_raw_payload_bytes: {{ .Values.quarantine.maxRawPayloadBytes }}
          {{- end }}
          {{- if .Values.quarantine.timeout }}
          timeout: {{ .Values.quarantine.timeout | quote }}
          {{- end }}
          {{- if .Values.quarantine.partitionExpirationDays }}
          partition_expiration_days: {{ .Values.quarantine.partitionExpirationDays }}
          {{- end }}
          {{- if .Values.quarantine.requirePartitionFilter }}
          require_partition_filter: {{ .Values.quarantine.requirePartitionFilter }}
          {{- end }}
          {{- if .Values.quarantine.kmsKeyName }}
          kms_key_name: {{ .Values.quarantine.kmsKeyName | quote }}
          {{- end }}
          {{- with .Values.quarantine.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.quarantine.maxStaleness }}
          max_staleness: {{ .Values.quarantine.maxStaleness | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.redaction.enabled }}
        redaction:
          enabled: true
          {{- with .Values.redaction.blockedKeys }}
          blocked_keys:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.redaction.disableDefaultKeys }}
          disable_default_keys: {{ .Values.redaction.disableDefaultKeys }}
          {{- end }}
          {{- with .Values.redaction.blockedValuePatterns }}
          blocked_value_patterns:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.redaction.maskReplacement }}
          mask_replacement: {{ .Values.redaction.maskReplacement | quote }}
          {{- end }}
          {{- if .Values.redaction.redactLogBody }}
          redact_log_body: {{ .Values.redaction.redactLogBody }}
          {{- end }}
        {{- end }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 900s
        sending_queue:
          enabled: true
          {{- if .Values.persistentQueue.enabled }}
          storage: file_storage
          {{- end }}

    {{- if .Values.healthCheck.enabled }}
    extensions:
      {{- if .Values.persistentQueue.enabled }}
      file_storage:
        directory: {{ .Values.persistentQueue.mountPath }}
        timeout: 1s
        compaction:
          on_start: true
          # filestorage otherwise compacts in its default directory,
          # /var/lib/otelcol/file_storage, which the read-only image lacks.
          directory: {{ .Values.persistentQueue.mountPath }}
      {{- end }}
      health_check:
        endpoint: 0.0.0.0:{{ .Values.healthCheck.port }}
    {{- else if .Values.persistentQueue.enabled }}
    extensions:
      file_storage:
        directory: {{ .Values.persistentQueue.mountPath }}
        timeout: 1s
        compaction:
          on_start: true
          # filestorage otherwise compacts in its default directory,
          # /var/lib/otelcol/file_storage, which the read-only image lacks.
          directory: {{ .Values.persistentQueue.mountPath }}
    {{- end }}

    service:
      extensions:
        {{- if .Values.healthCheck.enabled }}
        - health_check
        {{- end }}
        {{- if .Values.persistentQueue.enabled }}
        - file_storage
        {{- end }}
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
