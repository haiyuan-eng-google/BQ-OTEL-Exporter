apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bigquery-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bigquery-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.receivers.grpc.port }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.receivers.http.port }}
      targetPort: otlp-http
      protocol: TCP
    {{- if .Values.healthCheck.enabled }}
    - name: health
      port: {{ .Values.healthCheck.port }}
      targetPort: health
      protocol: TCP
    {{- end }}
