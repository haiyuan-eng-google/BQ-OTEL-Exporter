type: bigquery
display_name: BigQuery Exporter

status:
  class: exporter
  stability:
    development: [traces, logs, metrics]
  distributions: []
  codeowners:
    active: [haiyuan-eng-google]

tests:
  config:
    project: my-project
    dataset: otel
    traces:
      table: otel_spans
    logs:
      table: otel_logs
  skip_lifecycle: true

# Delivery-critical self-telemetry.
#
# These exist so an operator can answer "is this pipeline losing data?" from
# the collector alone, without querying BigQuery. Every label domain below is
# closed: nothing derived from telemetry content is ever used as a label, both
# because it would be unbounded cardinality and because it would leak payload
# into the metrics pipeline.
#
# Queue depth and queue drops are deliberately absent. exporterhelper already
# publishes them for the sending queue, and a second set of counters measuring
# the same queue would disagree under load and be worse than none.
#
# `make mdatagen` checks this file against the schema of the mdatagen release
# pinned by OCB_VERSION in the Makefile: metric and attribute keys must stay in
# ASCII order, every metric needs a stability level, and the label domains are
# declared once in the top-level attributes section at the end of the file.
telemetry:
  metrics:
    otelcol_exporter_bigquery_acknowledged_rows:
      enabled: true
      stability: development
      description: >-
        Rows acknowledged by the BigQuery Storage Write API. Incremented only
        after acknowledgement, never at enqueue time, so it can be compared
        against what the producer sent.
      unit: "{row}"
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_append_bytes:
      enabled: true
      stability: development
      description: >-
        Serialized protobuf wire bytes dispatched to the BigQuery Storage Write API.
      unit: By
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_append_result_wait:
      enabled: true
      stability: development
      description: Time from append dispatch until its result owner finishes.
      unit: s
      histogram:
        value_type: double
        bucket_boundaries: [0.001, 0.01, 0.1, 1, 5, 30, 70, 120]

    otelcol_exporter_bigquery_inflight_requests:
      enabled: true
      stability: development
      description: >-
        Dispatched append results that have not reached an exporter-owned
        terminal state.
      unit: "{request}"
      sum:
        value_type: int
        monotonic: false

    otelcol_exporter_bigquery_offload_dedup_hits:
      enabled: true
      stability: development
      description: >-
        Payload offload requests satisfied from the intra-batch coalescing
        cache or cross-batch generation LRU cache without a GCS upload, by
        signal.
      unit: "{hit}"
      sum:
        value_type: int
        monotonic: true
      attributes: [signal]

    otelcol_exporter_bigquery_offload_errors:
      enabled: true
      stability: development
      description: >-
        Payload offload attempts to external object storage that failed, by error class.
      unit: "{error}"
      sum:
        value_type: int
        monotonic: true
      attributes: [class]

    otelcol_exporter_bigquery_offloaded_bytes:
      enabled: true
      stability: development
      description: >-
        Payload bytes offloaded to external object storage.
      unit: By
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_offloaded_payloads:
      enabled: true
      stability: development
      description: >-
        Multimodal or oversized payloads offloaded to external object storage.
      unit: "{payload}"
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_quarantine_failed_rows:
      enabled: true
      stability: development
      description: >-
        Rows targeted for quarantine that could not be written due to
        serialization, size limit, or quarantine stream append failures.
      unit: "{row}"
      sum:
        value_type: int
        monotonic: true
      attributes: [reason]

    otelcol_exporter_bigquery_quarantined_rows:
      enabled: true
      stability: development
      description: >-
        Rows acknowledged by the BigQuery quarantine table stream, by reason.
      unit: "{row}"
      sum:
        value_type: int
        monotonic: true
      attributes: [reason]

    otelcol_exporter_bigquery_redacted_values:
      enabled: true
      stability: development
      description: >-
        Attribute keys and string values masked by the redaction step before
        the batch is offloaded, size-checked, fingerprinted, or quarantined,
        by signal and match type. Key names and values are never recorded.
      unit: "{value}"
      sum:
        value_type: int
        monotonic: true
      attributes: [match_type, signal]

    otelcol_exporter_bigquery_rejected_rows:
      enabled: true
      stability: development
      description: >-
        Rows permanently rejected and dropped from the signal tables, by
        reason. Counted whether or not quarantine is enabled. With quarantine
        disabled, the default, this counter is the only record that the data
        existed; with quarantine.enabled the rejected record is also written
        to the otel_quarantine table.
      unit: "{row}"
      sum:
        value_type: int
        monotonic: true
      attributes: [reason]

    otelcol_exporter_bigquery_retries:
      enabled: true
      stability: development
      description: Retryable append failures, by error class.
      unit: "{failure}"
      sum:
        value_type: int
        monotonic: true
      attributes: [class]

    otelcol_exporter_bigquery_stream_retirements:
      enabled: true
      stability: development
      description: >-
        Managed stream generations retired after an unsafe append outcome.
      unit: "{retirement}"
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_timeouts_after_dispatch:
      enabled: true
      stability: development
      description: Append attempts whose context ended after dispatch began.
      unit: "{timeout}"
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_uncertain_ack_replays:
      enabled: true
      stability: development
      description: >-
        Append replays triggered by an uncertain acknowledgement. This is the
        observable side of the duplicate bound: N replays permit at most N+1
        physical copies of a logical record. Crash replays from the persistent
        queue are explicitly out of scope and are not counted here.
      unit: "{replay}"
      sum:
        value_type: int
        monotonic: true

    otelcol_exporter_bigquery_unresolved_results:
      enabled: true
      stability: development
      description: >-
        Append results retained by lifecycle drainers after their original
        exporterhelper attempt ended.
      unit: "{result}"
      sum:
        value_type: int
        monotonic: false

attributes:
  class:
    description: >-
      The error class of a retryable append or offload failure. Bounded by
      construction; this enumeration is the whole domain.
    type: string
    enum:
      - quota_exhausted
      - unavailable
      - internal
      - permission_denied
      - credential
      - invalid_stream
      - schema_mismatch
      - invalid_argument
      - uncertain_ack
      - connection
      - request_canceled
      - shutdown_timeout
      - http_400
      - http_401
      - http_403
      - http_404
      - http_408
      - http_429
      - http_4xx
      - http_5xx
      - unknown

  match_type:
    description: >-
      Whether a redaction replaced the value of a blocked attribute key or a
      substring of a string value that matched a blocked pattern. Bounded by
      construction; this enumeration is the whole domain.
    type: string
    enum:
      - key
      - value

  reason:
    description: >-
      Why a row was permanently rejected or quarantined. Bounded by construction;
      this enumeration is the whole domain.
    type: string
    enum:
      - attribute_count
      - attribute_key_size
      - event_count
      - link_count
      - nesting_depth
      - collection_size
      - value_size
      - serialization
      - offload_permanent
      - request_permanent
      - row_bytes
      - row_error
      - invalid_id
      - missing_timestamp
      - timestamp_overflow
      - other

  signal:
    description: >-
      The pipeline signal the exporter instance serves. Bounded by
      construction; this enumeration is the whole domain.
    type: string
    enum:
      - logs
      - metrics
      - spans
