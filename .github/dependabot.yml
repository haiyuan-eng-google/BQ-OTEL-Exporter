version: 2

# Weekly, grouped update PRs keep the dependency surface patched without
# drowning the review queue. Security updates are raised separately by GitHub
# regardless of these schedules.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The Collector, pdata and contrib modules are versioned in lockstep, so
      # they move together or not at all. After merging one of these PRs, also
      # update OCB_VERSION in the Makefile, the pins in example/otelcol-builder.yaml
      # and the builder version in example/Dockerfile to the same release.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
          - "github.com/open-telemetry/*"
      google-cloud:
        patterns:
          - "cloud.google.com/go/*"
          - "github.com/googleapis/*"
          - "google.golang.org/api"
          - "google.golang.org/genproto/*"
          - "google.golang.org/grpc"
          - "google.golang.org/protobuf"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Tracks the pinned builder and runtime base images of the example collector.
  - package-ecosystem: docker
    directory: /example
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
