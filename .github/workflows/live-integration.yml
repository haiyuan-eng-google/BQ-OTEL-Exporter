name: Live BigQuery Integration

on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-integration:
    name: Live BigQuery Integration Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Live BigQuery configuration
        id: check-config
        env:
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
        run: |
          if [ -z "$BQ_PROJECT" ]; then
            echo "::warning::vars.BQ_PROJECT is not configured in repository variables. Live BigQuery integration tests require BQ_PROJECT and GCP authentication. Skipping live test suite."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.check-config.outputs.configured == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: steps.check-config.outputs.configured == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run integration tests (fail-closed via REQUIRE_LIVE_BQ=1)
        if: steps.check-config.outputs.configured == 'true'
        env:
          REQUIRE_LIVE_BQ: "1"
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}
        run: |
          go test -v -race -tags=integration -count=1 -timeout=10m ./...
