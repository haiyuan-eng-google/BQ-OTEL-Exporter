name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest_digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release binaries carry the standard library they were built with, so
      # build with the same patched Go release example/Dockerfile pins rather
      # than the go.mod minimum, which predates the standard-library fixes.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # The builder module installs a binary named builder; the GoReleaser
      # hook calls it as ocb. Both live in a job-local directory added to PATH.
      - name: Install OpenTelemetry Collector Builder (ocb)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          GOBIN="${bin}" GOTOOLCHAIN=local go install go.opentelemetry.io/collector/cmd/builder@v0.163.0
          ln -sf "${bin}/builder" "${bin}/ocb"
          echo "${bin}" >> "${GITHUB_PATH}"
          export PATH="${bin}:${PATH}"
          ocb version
          syft version
          cosign version

      # GoReleaser refuses to release from a checkout with modified tracked
      # files, so the tag goes into a copy of the OCB manifest outside the
      # checkout, and the before hook in .goreleaser.yaml builds from that copy.
      # The release-stamping job in ci.yml replays this step on every change.
      - name: Stamp release version into a copy of the OCB manifest
        id: stamp
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          manifest="${RUNNER_TEMP}/otelcol-builder-release.yaml"
          sed -e "s/version: 0.1.0-dev/version: ${VERSION}/g" \
            -e "s|github.com/haiyuan-eng-google/BQ-OTEL-Exporter v0.0.0|github.com/haiyuan-eng-google/BQ-OTEL-Exporter ${RELEASE_TAG}|g" \
            example/otelcol-builder-release.yaml > "${manifest}"
          echo "OCB_RELEASE_MANIFEST=${manifest}" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        id: build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published manifest digest
        id: manifest_digest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DIGEST="$(docker buildx imagetools inspect "ghcr.io/haiyuan-eng-google/bq-otel-collector:${VERSION}" --format '{{ .Manifest.Digest }}')"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Verify signed container manifest
        env:
          DIGEST: ${{ steps.manifest_digest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/haiyuan-eng-google/BQ-OTEL-Exporter/.github/workflows/release.yml@.*" \
            "ghcr.io/haiyuan-eng-google/bq-otel-collector@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/haiyuan-eng-google/bq-otel-collector
          subject-digest: ${{ steps.manifest_digest.outputs.digest }}
          push-to-registry: true
