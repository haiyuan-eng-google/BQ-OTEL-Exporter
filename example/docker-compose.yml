services:
  otelcollector:
    image: bq-otel-collector:0.1.0-dev
    build:
      context: ..
      dockerfile: example/Dockerfile
    # gcloud writes ADC owner-only (0600), which the image's distroless nonroot
    # user cannot read through a Linux bind mount. Set
    # BQ_CONTAINER_USER="$(id -u):$(id -g)" to run as the file's owner instead.
    user: "${BQ_CONTAINER_USER:-65532:65532}"
    command: ["--config=/etc/otel/config.yml"]
    environment:
      - BQ_PROJECT=${BQ_PROJECT}
      - BQ_DATASET=${BQ_DATASET}
      - BQ_LOCATION=${BQ_LOCATION:-US}
      - GOOGLE_APPLICATION_CREDENTIALS=/creds/adc.json
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
      - ${BQ_ADC_PATH:?Set BQ_ADC_PATH to an ADC JSON file}:/creds/adc.json:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    # Container security hardening.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "/healthcheck",
          "http://127.0.0.1:13133/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
