# Production-ready pipeline: OTLP in, BigQuery out.
#
# Credentials come from application default credentials. Nothing about the
# exporter requires a Google-hosted collector; it serves any OTLP producer.
#
# Delivery is at least once and may duplicate data. Query the shipped
# otel_spans_dedup and otel_logs_dedup views rather than the base tables.

receivers:
  otlp:
    # Do not remove either protocol. Google ADK and LangGraph can send OTLP/HTTP
    # only, while most other frameworks default to OTLP/gRPC. See "Transports"
    # in the README.
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop data if the collector itself is under memory pressure so the
  # pipeline back-pressures rather than OOM-kills.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  bigquery:
    project: ${env:BQ_PROJECT}
    dataset: ${env:BQ_DATASET}
    location: ${env:BQ_LOCATION}
    auto_create:
      dataset: true
      tables: true
    traces:
      table: otel_spans
    logs:
      table: otel_logs
    retry_on_failure:
      enabled: true
      # Finite on purpose: an unbounded horizon would remove the bound on how
      # many physical copies one logical record can produce.
      max_elapsed_time: 900s
    sending_queue:
      enabled: true

  # Optional diagnostic sink. Do not enable casually: OTLP JSON can contain
  # prompts, completions, task descriptions, and other customer data. Keep the
  # file on an access-controlled encrypted volume and set an explicit retention
  # policy. append defaults to false, so a collector restart truncates the file;
  # append: true preserves it but cannot be combined with rotation.
  # file/diagnostic:
  #   path: /var/lib/otel/diagnostic.jsonl
  #   append: false
  #   create_directory: true
  #   directory_permissions: "0700"
  #   rotation:
  #     max_megabytes: 100
  #     max_days: 1
  #     max_backups: 2

# Optional persistent queue for crash-replay durability.
#
# When enabled, the sending queue spills to disk instead of dropping data
# on collector shutdown or crash. Requires a file_storage extension
# (uncomment below and the storage entry in the bigquery exporter).
#
# extensions:
#   file_storage:
#     directory: /var/lib/otel/queue
#     timeout: 1s
#     compaction:
#       on_start: true
#       directory: /var/lib/otel/queue/compaction

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [bigquery]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [bigquery]
