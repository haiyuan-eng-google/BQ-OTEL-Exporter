# Production-ready pipeline: OTLP in, BigQuery out.
#
# Credentials come from application default credentials. Nothing about the
# exporter requires a Google-hosted collector; it serves any OTLP producer.
#
# Delivery is at least once and may duplicate data. Query the shipped
# otel_spans_dedup, otel_logs_dedup, and otel_metrics_dedup views rather than
# the base tables.

receivers:
  otlp:
    # Do not remove either protocol. Google ADK and LangGraph can send OTLP/HTTP
    # only, while most other frameworks default to OTLP/gRPC. See "Transports"
    # in the README.
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop data if the collector itself is under memory pressure so the
  # pipeline back-pressures rather than OOM-kills.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  bigquery:
    project: ${env:BQ_PROJECT}
    dataset: ${env:BQ_DATASET}
    location: ${env:BQ_LOCATION}
    auto_create:
      dataset: true
      tables: true
      # Companion views (otel_spans_as_allspans, v_gen_ai_spans, v_gen_ai_logs,
      # v_gen_ai_metrics, v_gen_ai_model_costs, v_gen_ai_sessions,
      # v_gen_ai_tool_usage) are opt-in. Uncomment to have auto_create build them.
      # companion_views: true
      # Search indexes on (trace_id, span_id) for otel_spans and otel_logs,
      # and all columns on otel_metrics. Requires auto_create.tables and
      # bigquery.jobs.create (see deploy/terraform/ with grant_auto_create).
      search_indexes: false
    traces:
      table: otel_spans
      # partition_expiration_days: 365
      # require_partition_filter: true
      # kms_key_name: projects/my-project/locations/us-central1/keyRings/otel/cryptoKeys/spans
      # labels:
      #   environment: production
      # max_staleness: 15m
    logs:
      table: otel_logs
      # partition_expiration_days: 90
      # require_partition_filter: true
      # log_name_attribute: log.file.name
      # insert_id_attribute: log.record.uid
      # kms_key_name: projects/my-project/locations/us-central1/keyRings/otel/cryptoKeys/logs
      # labels:
      #   environment: production
      # max_staleness: 10m
    metrics:
      table: otel_metrics
      # partition_expiration_days: 180
      # require_partition_filter: true
      # kms_key_name: projects/my-project/locations/us-central1/keyRings/otel/cryptoKeys/metrics
      # labels:
      #   environment: production
      # max_staleness: 20m

    # Optional GCS offload for large payloads (prompts, completions, images).
    # Offloaded payloads are referenced from payload_refs via BigQuery
    # ObjectRef. Configure a GCS lifecycle policy to manage retention; the
    # exporter does not delete offloaded objects. A 401/403/404 on upload is
    # classified as a permanent error and routes the record to quarantine.
    # offload:
    #   enabled: false
    #   bucket: my-otel-offload-bucket
    #   prefix: otel
    #   authorizer: my-project.us.otel-gcs
    #   min_bytes: 1048576
    #   max_object_bytes: 67108864
    #   max_concurrency: 4
    #   timeout: 30s
    #   cache_size: 4096

    # Optional quarantine dead-letter table for rejected records. When
    # enabled, permanently rejected rows are written to otel_quarantine
    # instead of being dropped. Use cmd/bq-quarantine-replay to replay
    # quarantined records after fixing the underlying issue.
    # quarantine:
    #   enabled: false
    #   table: otel_quarantine
    #   metadata_only: false
    #   partition_expiration_days: 30
    #   max_raw_payload_bytes: 1048576
    #   timeout: 5s
    #   kms_key_name: projects/my-project/locations/us-central1/keyRings/otel/cryptoKeys/quarantine
    #   labels:
    #     environment: production
    #   max_staleness: 30m

    # Optional client-side PII and secret redaction. Runs at Step 0 before
    # offload, fingerprinting, and quarantine. Default sensitive keys
    # (authorization, token, password, api_key, secret, private_key, etc.)
    # are redacted unless disable_default_keys is true.
    # redaction:
    #   enabled: false
    #   blocked_keys: []
    #   disable_default_keys: false
    #   blocked_value_patterns: []
    #   mask_replacement: "[REDACTED]"
    #   redact_log_body: false

    # Enterprise governance: CMEK encryption and labels for cost allocation.
    # kms_key_name: projects/my-project/locations/us-central1/keyRings/otel/cryptoKeys/bq
    # labels:
    #   environment: production
    #   team: observability

    retry_on_failure:
      enabled: true
      # Finite on purpose: an unbounded horizon would remove the bound on how
      # many physical copies one logical record can produce.
      max_elapsed_time: 900s
    sending_queue:
      enabled: true

  # Optional diagnostic sink. Do not enable casually: OTLP JSON can contain
  # prompts, completions, task descriptions, and other customer data. Keep the
  # file on an access-controlled encrypted volume and set an explicit retention
  # policy. append defaults to false, so a collector restart truncates the file;
  # append: true preserves it but cannot be combined with rotation.
  # file/diagnostic:
  #   path: /var/lib/otel/diagnostic.jsonl
  #   append: false
  #   create_directory: true
  #   directory_permissions: "0700"
  #   rotation:
  #     max_megabytes: 100
  #     max_days: 1
  #     max_backups: 2

# Optional persistent queue for crash-replay durability.
#
# When enabled, the sending queue spills to disk instead of dropping data
# on collector shutdown or crash. Requires a file_storage extension
# (uncomment below and the storage entry in the bigquery exporter).
#
# Mount a writable volume at /var/lib/otel/queue first. Compaction runs in
# the same directory: a separate compaction directory would have to exist
# on the volume before the collector starts.
#
# extensions:
#   file_storage:
#     directory: /var/lib/otel/queue
#     timeout: 1s
#     compaction:
#       on_start: true
#       directory: /var/lib/otel/queue

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [bigquery]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [bigquery]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [bigquery]
